name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ownmaily
          POSTGRES_PASSWORD: ownmaily
          POSTGRES_DB: ownmaily
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ownmaily"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same value the test helpers fall back to when TEST_DB_URL is unset.
      TEST_DB_URL: postgres://ownmaily:ownmaily@localhost:5433/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 120s

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build
        run: pnpm --dir frontend build
