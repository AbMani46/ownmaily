# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv:
  - .env

tasks:
  dev:
    desc: Run the development server
    cmds:
      - go run ./cmd/server/...

  build:
    desc: Build the production binary to bin/ownmaily
    cmds:
      - mkdir -p bin
      - go build -o bin/ownmaily ./cmd/server/...

  sqlc-gen:
    desc: Generate Go code from SQL queries
    cmds:
      - docker run --rm -v $(pwd):/src -w /src sqlc/sqlc generate

  migrate-up:
    desc: Run all pending database migrations
    cmds:
      - migrate -database "${DB_URL}" -path db/migrations up

  migrate-down:
    desc: Roll back N migrations (STEP=1 by default)
    cmds:
      - migrate -database "${DB_URL}" -path db/migrations down {{.STEP | default "1"}}

  migrate-create:
    desc: Create a new migration file pair (NAME=<name>)
    cmds:
      - migrate create -ext sql -dir db/migrations -seq {{.NAME}}
    requires:
      vars:
        - NAME

  docker-up:
    desc: Start Docker Compose services in the background
    cmds:
      - docker compose up -d

  docker-down:
    desc: Stop and remove Docker Compose services
    cmds:
      - docker compose down

  psql:
    desc: Open a psql shell to the dev database
    cmds:
      - psql "${DB_URL}"

  test:
    desc: Run all tests (requires Postgres on :5433)
    cmds:
      - go test ./... -v -timeout 120s

  frontend-dev:
    desc: Start Vue dev server on :5173
    cmds:
      - pnpm --dir frontend dev

  frontend-build:
    desc: Build Vue for production (outputs to frontend/dist)
    cmds:
      - pnpm --dir frontend build

  docker-build:
    desc: Build production Docker image
    cmds:
      - docker build -t ownmaily/ownmaily:latest .

  docker-run:
    desc: Run production image locally
    cmds:
      - docker compose -f docker-compose.yml up -d
