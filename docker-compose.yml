services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ownmaily
      POSTGRES_USER: ownmaily
      POSTGRES_PASSWORD: ownmaily
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownmaily -d ownmaily"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
